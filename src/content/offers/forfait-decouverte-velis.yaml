title: Forfait découverte Velis Electro
icon: runway
photo: ../../assets/offers/forfait-decouverte-velis/photo.png
tagline: 3 vols pour décider en connaissance de cause
description: >-
  Le forfait découverte Velis Electro comprend 3 vols d'initiation progressifs
  avec le même instructeur sur notre avion électrique. À l'issue, vous avez
  toutes les cartes en main pour choisir de poursuivre vers la licence ou
  simplement de répéter l'expérience.
duration: 3 × 45 min de vol
price: 499 €
capacity: 1 pilote stagiaire
notes: >-
  Le montant comprend la licence FFA, 3 séances de vol sur Velis Electro, un
  carnet de vol. Une réduction de 50€ sera appliqué sur votre cotisation si vous
  continuez votre formation à l'aéroclub.
order: 3
