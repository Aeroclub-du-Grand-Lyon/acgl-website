question: Doit-on s'équiper spécialement ?
answer: >-
  Aucun équipement particulier n'est nécessaire. Venez avec des chaussures
  fermées et des vêtements confortables. En été, nous recommandons une casquette ou un chapeau pour se protéger du soleil, ainsi qu'un vêtement
  léger supplémentaire - l'altitude rafraîchit.
page: discovery-flights
order: 5
