question: L'ACGL forme-t-il les pilotes de ligne ?
answer: >-
  Non, l'ACGL est un aéroclub associatif : nous formons au vol de loisir et de
  voyage, pas au métier de pilote de ligne (formation ATPL en école
  professionnelle). Cela dit, la quasi-totalité des pilotes de ligne ont
  commencé par le brevet de pilote privé (PPL) : c'est la première brique du
  parcours, et vous pouvez l'obtenir chez nous avant de rejoindre une école
  professionnelle.
page: flight-school
order: 6
