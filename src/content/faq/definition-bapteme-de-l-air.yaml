question: C'est quoi un baptême de l'air ?
answer: >-
  Le baptême de l'air, que l'on appelle aussi vol découverte, est votre premier
  vol en avion léger. Vous décollez de l'aéroport de Lyon Bron aux côtés d'un
  instructeur du club et survolez la région lyonnaise pendant une trentaine de
  minutes. Aucune expérience préalable n'est nécessaire : il suffit d'avoir
  envie de découvrir les sensations du vol.
